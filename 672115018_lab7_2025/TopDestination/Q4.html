<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Destinations in Thailand</title>
    <style>
        /* 3.2.4 to style the table [1 point] */
        .styled-table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
            font-size: 18px;
            text-align: left;
            font-family: sans-serif;
            border: 1px solid #dddddd;
        }
        .styled-table th,
        .styled-table td {
            padding: 12px;
            border: 1px solid #dddddd;
        }
        
        .styled-table thead {
            background-color: #eab429; /* Mustard yellow color from screenshot */
            color: white;
            font-weight: bold;
        }

        /* 4.3 (Optional Bonus) Style alternating rows */
        .styled-table tbody tr:nth-of-type(even) {
            background-color: #f3f3f3;
        }
    </style>
</head>
<body>
    <div id="destination-container"></div>
    <script src="script.js"></script>
</body>
</html>
