<!DOCTYPE html>
<html
  lang="en"
  xmlns:mso="urn:schemas-microsoft-com:office:office"
  xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882"
>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life in weeks</title>
  </head>
  <body>

    <p></p>

    <script>
      // write your code here
      
      // 1.Take the age via prompt box 
      // [1 point]
      var ageInput = prompt("What is your current age?");

      function lifeInWeeks(currentAge) {

        // Calculate remaining years until 90
        var yearsRemaining = 90 - currentAge;

        // 2. Create an Object variable for storing properties of "days", "weeks" and "months"
        // 3. Compute remaining times and store values into the Object properties and return the object
        // [2 points]
        
        var remainingTime = {
            days: yearsRemaining * 365,
            weeks: yearsRemaining * 52,
            months: yearsRemaining * 12 
            
            
        };

        return remainingTime;
      }

      // 4. Call the "lifeInWeeks" which returns the Object of remaining times
      // 5. Manipulate values of the Object to display result in an alert box with the format “You have x days, y weeks, and z months left.” 
      // [2 points]
  
      // Ensure input is valid before running logic
      if (ageInput !== null && ageInput !== "") {
          var result = lifeInWeeks(ageInput);
          
          alert("You have " + result.days + " days, " + result.weeks + " weeks, and " + result.months + " months left.");
      }

    </script>
  </body>
</html>
